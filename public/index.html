<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDK Vaults — 兑换中心</title>
    <meta name="description" content="输入您的CDK兑换码，立即获取数字资产">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <span class="brand-text">CDK <span class="brand-highlight">Vaults</span></span>
        </div>
    </nav>

    <main class="main-content">
        <div id="site-notice" class="site-notice hidden">
            <div class="site-notice-label">通知</div>
            <div id="site-notice-content" class="site-notice-content"></div>
        </div>
        <section id="redeem-section" class="redeem-section">
            <div class="section-badge">✦ 数字资产兑换</div>
            <h1 class="hero-title">输入您的 <span class="gradient-text">CDK 兑换码</span></h1>
            <p class="hero-subtitle">支持单个或多个兑换码，每行一个</p>
            <div class="redeem-card">
                <div class="input-area">
                    <textarea id="cdk-input" rows="3" placeholder="CDK-XXXX-XXXX-XXXX&#10;支持多个兑换码，每行一个" autocomplete="off" spellcheck="false"></textarea>
                </div>

                <!-- Codex 识别提示 + 格式选择器 -->
                <div id="detect-hint" class="detect-hint hidden">
                    <span class="detect-icon">⚡</span>
                    <span>已识别为 <strong>Codex</strong> 账号卡密，请选择导出格式</span>
                </div>
                <div id="format-selector" class="format-selector hidden">
                    <div class="format-label">📦 导出格式（按 JSON 字段自动限制）</div>
                    <div class="format-options">
                        <label class="format-option active">
                            <input type="radio" name="export-format" value="text" checked>
                            <div class="format-card">
                                <div class="format-name">文本格式</div>
                                <div class="format-desc">邮箱----GPT密码----邮箱密码</div>
                            </div>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="export-format" value="cpa">
                            <div class="format-card">
                                <div class="format-name">CPA 格式</div>
                                <div class="format-desc">包含 access_token</div>
                            </div>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="export-format" value="sub2api_single">
                            <div class="format-card">
                                <div class="format-name">Sub2API 合并</div>
                                <div class="format-desc">包含 access_token，合并为单个文件</div>
                            </div>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="export-format" value="auth_json">
                            <div class="format-card">
                                <div class="format-name">auth.json 格式</div>
                                <div class="format-desc">Codex 原始 Oauth 格式</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div id="quota-panel" class="quota-panel hidden">
                    <div class="quota-info">
                        <span class="quota-label">剩余资产</span>
                        <strong id="quota-remaining">0 / 0</strong>
                    </div>
                    <div class="quota-info">
                        <span class="quota-label">当前库存</span>
                        <strong id="quota-inventory">0</strong>
                    </div>
                    <div class="quota-control">
                        <label for="redeem-quantity">本次数量</label>
                        <div class="quantity-stepper">
                            <button type="button" id="quantity-minus">−</button>
                            <input type="number" id="redeem-quantity" value="1" min="1" max="1">
                            <button type="button" id="quantity-plus">+</button>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <button id="redeem-btn" class="redeem-btn" disabled>
                        <span class="btn-text">兑换</span>
                        <span class="btn-loader hidden"></span>
                    </button>
                </div>
                <div id="error-msg" class="error-msg hidden"></div>
            </div>
        </section>

        <section id="result-section" class="result-section hidden">
            <div class="result-card">
                <div class="result-header">
                    <div class="success-icon">✓</div>
                    <h2 class="result-title">兑换成功！</h2>
                    <p class="result-subtitle" id="result-asset-name"></p>
                </div>
                <div class="result-body" id="result-body"></div>
                <div class="result-footer">
                    <button id="back-btn" class="back-btn">← 继续兑换</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>CDK Vaults &copy; 2026 — 安全可靠的数字资产兑换平台</p>
    </footer>
    <script src="/app.js?v=20260510-detectgate"></script>
</body>
</html>
